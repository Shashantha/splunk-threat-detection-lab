[Detect Suspicious Remote Service Creation (Event 7045)]
action.logevent = 1
action.logevent.param.event = Suspicious Remote Service Creation (Event 7045)
action.webhook.enable_allowlist = 0
alert.suppress = 0
alert.track = 0
counttype = number of events
cron_schedule = 0 6 * * 1
description = Identifies high-risk service installations involving command interpreters or temporary paths, indicative of lateral movement persistence.
dispatch.earliest_time = -1w
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=* 7045 \
| rex "<Data Name='ServiceName'>(?<ServiceName>[^<]+)</Data>"\
| rex "<Data Name='ImagePath'>(?<ServiceFileName>[^<]+)</Data>" \
| eval ThreatLevel = case(\
    match(ServiceFileName, "(?i)(cmd\.exe|powershell|mshta|temp|tmp|comspec)"), "High",\
    1=1, "Medium"\
)\
| table _time, host, ServiceName, ServiceFileName, ThreatLevel
